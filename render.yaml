services:
  - type: web
    name: lsnb-alumni-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: VITE_HUB_URL
        sync: false
      # Cloudflare Turnstile site key: the anti-robot check of the sign-up, sign-in and
      # reset forms (audit M3). Unset, the forms show no check and send no token.
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
    # Security headers; the hub sends the same ones.
    # The home page shows the school's photo from its own site (src/data/homePhotos.ts).
    # Turnstile needs its script and the frame it draws the check in (challenges.cloudflare.com).
    # The Content Security Policy only reports for now: once the live site's console
    # shows no "[Report Only]" refusal, it becomes Content-Security-Policy.
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://yesumbhssechcrlgpgqj.supabase.co https://*.googleusercontent.com https://www.lobspaalga.com; connect-src 'self' https://yesumbhssechcrlgpgqj.supabase.co wss://yesumbhssechcrlgpgqj.supabase.co https://lsnb-alumni-api.onrender.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Independent static app: its entry point never mounts the site's maintenance gate.
  - type: web
    name: lsnb-alumni-hub
    runtime: static
    buildCommand: npm ci --include=dev && npm run build:hub
    staticPublishPath: ./dist-hub
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: VITE_SITE_URL
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: Cache-Control
        value: no-store
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://yesumbhssechcrlgpgqj.supabase.co https://*.googleusercontent.com; connect-src 'self' https://yesumbhssechcrlgpgqj.supabase.co wss://yesumbhssechcrlgpgqj.supabase.co https://lsnb-alumni-api.onrender.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: lsnb-alumni-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false

  # Independent job: runs even when the free API service is asleep.
  # Second run recovers an interrupted job after the 15-minute DB lease expires.
  # It reuses the same edition and never repeats an attempted OpenAI request.
  - type: cron
    name: lsnb-alumni-highlights
    runtime: node
    rootDir: api
    plan: starter
    schedule: "0,20 0 * * 1"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run highlights:generate
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
